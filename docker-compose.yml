services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://panel:${POSTGRES_PASSWORD:-panel}@db:5432/panel
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET requerido}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET:?PROVISIONING_SECRET requerido}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@panel.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requerido}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SIMULATION_MODE: ${SIMULATION_MODE:-false}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panel}
      POSTGRES_DB: panel
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  uploads:
